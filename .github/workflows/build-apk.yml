name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # 仅拉取最新代码

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove local.properties (CI uses ANDROID_HOME)
        run: rm -f local.properties

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Determine app version
        id: ver
        env:
          TZ: Asia/Shanghai   # 使用北京时间（UTC+8）
        run: |
          # 默认使用构建时间：versionName=YYYYMMDDHHMM，versionCode=Unix 秒时间戳（单调、可编译、覆盖安装不冲突）
          echo "app_version=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon -PappVersionName="${{ steps.ver.outputs.app_version }}" -PappVersionCode="${{ steps.ver.outputs.app_version_code }}"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouDiZhu-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai   # 使用北京时间（UTC+8），与版本号保持一致
        run: |
          DATE=$(date +%Y%m%d-%H%M)
          TAG="build-${DATE}-${{ github.run_number }}"
          APK="DouDiZhu-${DATE}-${{ steps.ver.outputs.app_version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK}"
          gh release create "${TAG}" "${APK}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DouDiZhu 构建 ${DATE}" \
            --notes "commit: ${GITHUB_SHA:0:7} | 版本: ${{ steps.ver.outputs.app_version }}"
